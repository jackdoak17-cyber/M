name: Track Polymarket Markets

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track_markets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tracker
        env:
          POLYMARKET_GAMMA_BASE_URL: ${{ vars.POLYMARKET_GAMMA_BASE_URL || 'https://gamma-api.polymarket.com' }}
          POLYMARKET_WINDOW_LABEL: ${{ vars.POLYMARKET_WINDOW_LABEL }}
        run: python -m src.polymarket_tracker --window-label "${POLYMARKET_WINDOW_LABEL:-since last update}"

      - name: Commit tracker snapshots
        run: |
          git config user.name "polymarket-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add output/polymarket/
          if git diff --cached --quiet; then
            echo "No tracker changes to commit."
            exit 0
          fi
          git commit -m "Update Polymarket tracker snapshot $(date +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push
