name: Post Instagram By Fixture

on:
  push:
    paths:
      - ".github/workflows/post_instagram_by_fixture.yml"
      - "src/posting/post_instagram_by_fixture.py"
  workflow_dispatch:
    inputs:
      slot:
        description: "By-fixture Instagram slot"
        required: true
        default: "weekend_fixture"
        type: choice
        options:
          - weekend_fixture
          - weekday_fixture
      dry_run:
        description: "Dry run (no post to Instagram)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      target_date:
        description: "Scheduled post date (YYYY-MM-DD)."
        required: true
        default: ""

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve slot/date
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
            DRY_RUN="${{ inputs.dry_run }}"
            DATE_ARG="--date ${{ inputs.target_date }}"
          else
            SLOT="weekend_fixture"
            DRY_RUN="false"
            DATE_ARG="--date 2026-03-01"
          fi
          echo "SLOT=$SLOT" >> "$GITHUB_ENV"
          echo "DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"
          echo "DATE_ARG=$DATE_ARG" >> "$GITHUB_ENV"

      - name: Post approved by-fixture Instagram content
        run: python -m src.posting.post_instagram_by_fixture --slot "$SLOT" --dry-run "$DRY_RUN" $DATE_ARG
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_ANALYST_X_POST_BOT_TOKEN: ${{ secrets.ODDS_ANALYST_X_POST_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          CLOUDFLARE_R2_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY }}
          CLOUDFLARE_R2_SECRET_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          S3_API_ENDPOINT: ${{ secrets.S3_API_ENDPOINT }}
          PROP_SHEET_TIMEZONE: ${{ vars.PROP_SHEET_TIMEZONE || 'Europe/London' }}
