name: Post to X

on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "30 12 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Post slot"
        required: true
        default: "weekday_fixture"
        type: choice
        options:
          - weekend_fixture
          - weekend_player_100
          - weekend_player_80
          - weekday_fixture
          - weekday_player
      dry_run:
        description: "Dry run (no post to X)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
          else
            case "${{ github.event.schedule }}" in
              "0 9 * * *") SLOT="weekend_fixture" ;;
              "0 10 * * *") SLOT="weekend_player_100" ;;
              "0 11 * * *") SLOT="weekend_player_80" ;;
              "30 12 * * *") SLOT="weekday_fixture" ;;
              "30 13 * * *") SLOT="weekday_player" ;;
              *) SLOT="" ;;
            esac
          fi
          echo "SLOT=$SLOT" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "DRY_RUN=${{ inputs.dry_run }}" >> "$GITHUB_ENV"
          else
            echo "DRY_RUN=false" >> "$GITHUB_ENV"
          fi

      - name: Post approved content
        run: |
          if [ -z "$SLOT" ]; then
            echo "No slot resolved."
            exit 0
          fi
          python -m src.posting.post_to_x --slot "$SLOT" --dry-run "$DRY_RUN"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_ANALYST_X_POST_BOT_TOKEN: ${{ secrets.ODDS_ANALYST_X_POST_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          CLIENT_SECRET_ID: ${{ secrets.CLIENT_SECRET_ID }}
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
          PROP_SHEET_TIMEZONE: ${{ vars.PROP_SHEET_TIMEZONE || 'Europe/London' }}
