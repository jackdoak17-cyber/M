name: Generate Premier League Prop Sheets

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: prop-sheet
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run generator
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PROP_SHEET_TIMEZONE: Europe/London
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          if os.getenv("GITHUB_EVENT_NAME") != "workflow_dispatch":
              now = datetime.now(ZoneInfo("Europe/London"))
              if now.hour != 10:
                  print("Skipping run: not 10:00 UK time.")
                  raise SystemExit(0)
          PY
          python -m src.main --output-dir output

      - name: Alert on approved post drift
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_ANALYST_X_POST_BOT_TOKEN: ${{ secrets.ODDS_ANALYST_X_POST_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROP_SHEET_TIMEZONE: Europe/London
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$ODDS_ANALYST_X_POST_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Skipping drift alert: missing required credentials."
            exit 0
          fi
          python -m src.posting.alert_x_content_drift --window-days 7

      - name: Commit outputs
        run: |
          git config user.name "prop-sheet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f output/by_fixture/*.txt output/player_props/*.txt
          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi
          git commit -m "Update prop sheet outputs"
          git fetch origin main
          git rebase origin/main
          git push
