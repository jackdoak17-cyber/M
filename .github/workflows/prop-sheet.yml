name: Generate Premier League Prop Sheets

on:
  schedule:
    - cron: "0 * * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run generator
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PROP_SHEET_TIMEZONE: Europe/London
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          if os.getenv("GITHUB_EVENT_NAME") != "workflow_dispatch":
              now = datetime.now(ZoneInfo("Europe/London"))
              if not (now.weekday() == 3 and now.hour == 10):
                  print("Skipping run: not 10:00 UK time.")
                  raise SystemExit(0)
          PY
          python -m src.main --output-dir output

      - name: Commit outputs
        run: |
          git config user.name "prop-sheet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f output/saturday_prop_sheet.txt output/sunday_prop_sheet.txt
          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi
          git commit -m "Update prop sheet outputs"
          git push
