name: Check Prop Results

on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run result checker
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m src.prop_bot.check_results

      - name: Commit updated picks
        run: |
          git config user.name "prop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add picks/
          if git diff --cached --quiet; then
            echo "No updates to commit."
            exit 0
          fi
          git commit -m "Update prop results $(date +%Y-%m-%d)"
          git push
