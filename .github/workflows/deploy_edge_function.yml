name: Deploy Telegram Webhook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if echo "$SUPABASE_ACCESS_TOKEN" | grep -Eq '^sbp_v0_'; then
            echo "SUPABASE_ACCESS_TOKEN looks like a classic token (sbp_v0_...)."
            echo "Create a new access token (non-classic) that starts with sbp_ and has no extra underscores."
            exit 1
          fi
          if ! echo "$SUPABASE_ACCESS_TOKEN" | grep -Eq '^sbp_[A-Za-z0-9]+$'; then
            echo "SUPABASE_ACCESS_TOKEN is not in the expected sbp_... format."
            echo "Make sure you pasted the full token value with no spaces or quotes."
            exit 1
          fi
          npx supabase@latest functions deploy telegram-webhook --project-ref "$SUPABASE_PROJECT_REF"
