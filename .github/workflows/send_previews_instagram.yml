name: Send Instagram Telegram Previews

on:
  push:
    paths:
      - ".github/workflows/send_previews_instagram.yml"
      - "src/posting/send_previews_instagram.py"
      - "src/instagram/renderer.py"
      - "src/instagram/assets.py"
      - "src/instagram/manifest_io.py"
  schedule:
    - cron: "0 16 * * 5"
    - cron: "0 17 * * 5"
    - cron: "30 6 * * 6"
    - cron: "30 7 * * 6"
    - cron: "30 6 * * 0"
    - cron: "30 7 * * 0"
  workflow_dispatch:
    inputs:
      slot:
        description: "Instagram preview slot"
        required: true
        default: "ig_shot_props_value"
        type: choice
        options:
          - ig_shot_props_value
          - ig_shot_props_high_prob
      target_date:
        description: "Scheduled post date (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  preview-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slot:
          - ig_shot_props_value
          - ig_shot_props_high_prob
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: npx -y playwright@1.52.0 install chromium

      - name: Send Instagram preview
        run: python -m src.posting.send_previews_instagram --slot "${{ matrix.slot }}"
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_ANALYST_X_POST_BOT_TOKEN: ${{ secrets.ODDS_ANALYST_X_POST_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY }}
          CLOUDFLARE_R2_SECRET_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          S3_API_ENDPOINT: ${{ secrets.S3_API_ENDPOINT }}
          PROP_SHEET_TIMEZONE: ${{ vars.PROP_SHEET_TIMEZONE || 'Europe/London' }}

  preview:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: npx -y playwright@1.52.0 install chromium

      - name: Resolve slot
        run: |
          is_valid_london_cron() {
            CRON_EXPR="$1"
            LONDON_OFFSET="$(TZ='Europe/London' date +%z)"
            case "$CRON_EXPR" in
              "0 16 * * 5"|"30 6 * * 6"|"30 6 * * 0")
                [ "$LONDON_OFFSET" = "+0100" ]
                ;;
              "0 17 * * 5"|"30 7 * * 6"|"30 7 * * 0")
                [ "$LONDON_OFFSET" = "+0000" ]
                ;;
              *)
                return 0
                ;;
            esac
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
          else
            if [ "${{ vars.ENABLE_INSTAGRAM_AUTOMATION || 'false' }}" != "true" ]; then
              echo "Instagram automation disabled via ENABLE_INSTAGRAM_AUTOMATION variable."
              SLOT=""
            else
              case "${{ github.event.schedule }}" in
                "0 16 * * 5") SLOT="ig_shot_props_value" ;;
                "0 17 * * 5") SLOT="ig_shot_props_value" ;;
                "30 6 * * 6") SLOT="ig_shot_props_high_prob" ;;
                "30 7 * * 6") SLOT="ig_shot_props_high_prob" ;;
                "30 6 * * 0") SLOT="ig_shot_props_high_prob" ;;
                "30 7 * * 0") SLOT="ig_shot_props_high_prob" ;;
                *) SLOT="" ;;
              esac
              if [ -n "$SLOT" ] && ! is_valid_london_cron "${{ github.event.schedule }}"; then
                echo "Skipping ${SLOT} for cron '${{ github.event.schedule }}' (wrong Europe/London offset)."
                SLOT=""
              fi
            fi
          fi
          echo "SLOT=$SLOT" >> "$GITHUB_ENV"

      - name: Send Instagram preview
        run: |
          if [ -z "$SLOT" ]; then
            echo "No slot resolved."
            exit 0
          fi
          DATE_ARG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.target_date }}" ]; then
            DATE_ARG="--date ${{ inputs.target_date }}"
          fi
          python -m src.posting.send_previews_instagram --slot "$SLOT" $DATE_ARG
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_ANALYST_X_POST_BOT_TOKEN: ${{ secrets.ODDS_ANALYST_X_POST_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY }}
          CLOUDFLARE_R2_SECRET_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          S3_API_ENDPOINT: ${{ secrets.S3_API_ENDPOINT }}
          PROP_SHEET_TIMEZONE: ${{ vars.PROP_SHEET_TIMEZONE || 'Europe/London' }}
