name: Snapshot Monday Odds

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Take Monday odds snapshot
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m src.odds_movement.snapshot

      - name: Commit snapshot
        run: |
          git config user.name "odds-snapshot"
          git config user.email "actions@users.noreply.github.com"
          git add output/odds_movement/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Snapshot Monday odds $(date +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push
