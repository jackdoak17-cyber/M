name: Generate Odds Movement Post

on:
  schedule:
    - cron: "0 8 * * 6"
    - cron: "0 8 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate odds movement post
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PROP_SHEET_TIMEZONE: ${{ vars.PROP_SHEET_TIMEZONE || 'Europe/London' }}
        run: python -m src.odds_movement.generate_post

      - name: Commit post
        run: |
          git config user.name "odds-movement"
          git config user.email "actions@users.noreply.github.com"
          git add output/odds_movement/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Generate odds movement post $(date +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push
