name: Publish Approved Instagram Package

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Approved social package UUID."
        required: true
        type: string
      account_key:
        description: "Isolated Operations account key."
        required: true
        default: "oddssearch-main"
        type: string
      confirm_publish:
        description: "Type PUBLISH INSTAGRAM to create a visible Instagram post."
        required: true
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: instagram-social-package-${{ inputs.post_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Publish approved package
        run: |
          python -m src.posting.publish_social_package \
            --confirmation "${{ inputs.confirm_publish }}" \
            --post-id "${{ inputs.post_id }}" \
            --account-key "${{ inputs.account_key }}" \
            --workflow-run-id "${{ github.run_id }}"
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Record result
        if: success()
        run: |
          printf '## Instagram package published\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Package: `%s`\n' "${{ inputs.post_id }}" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Account: `%s`\n' "${{ inputs.account_key }}" >> "$GITHUB_STEP_SUMMARY"
