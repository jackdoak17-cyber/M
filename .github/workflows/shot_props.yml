name: Generate Shot Props

on:
  schedule:
    - cron: "0 15 * * 5"
    - cron: "0 16 * * 5"
    - cron: "15 6 * * 6"
    - cron: "15 7 * * 6"
    - cron: "15 6 * * 0"
    - cron: "15 7 * * 0"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target fixture date (YYYY-MM-DD). Leave blank for default schedule behavior."
        required: false
        default: ""

concurrency:
  group: shot-props
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve target date
        run: |
          is_valid_london_cron() {
            CRON_EXPR="$1"
            LONDON_OFFSET="$(TZ='Europe/London' date +%z)"
            case "$CRON_EXPR" in
              "0 15 * * 5"|"15 6 * * 6"|"15 6 * * 0")
                [ "$LONDON_OFFSET" = "+0100" ]
                ;;
              "0 16 * * 5"|"15 7 * * 6"|"15 7 * * 0")
                [ "$LONDON_OFFSET" = "+0000" ]
                ;;
              *)
                return 0
                ;;
            esac
          }

          echo "SKIP_RUN=false" >> "$GITHUB_ENV"
          echo "TARGET_DATE=" >> "$GITHUB_ENV"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.target_date }}" ]; then
              echo "TARGET_DATE=${{ inputs.target_date }}" >> "$GITHUB_ENV"
              echo "Resolved TARGET_DATE=${{ inputs.target_date }} (workflow_dispatch override)"
            fi
            exit 0
          fi

          if ! is_valid_london_cron "${{ github.event.schedule }}"; then
            echo "Skipping shot props generation for cron '${{ github.event.schedule }}' (wrong Europe/London offset)."
            echo "SKIP_RUN=true" >> "$GITHUB_ENV"
            exit 0
          fi

          case "${{ github.event.schedule }}" in
            "0 15 * * 5"|"0 16 * * 5")
              TARGET_DATE="$(TZ='Europe/London' date -d tomorrow +%F)"
              ;;
            "15 6 * * 6"|"15 7 * * 6"|"15 6 * * 0"|"15 7 * * 0")
              TARGET_DATE="$(TZ='Europe/London' date +%F)"
              ;;
            *)
              echo "No target date mapping for cron '${{ github.event.schedule }}'."
              echo "SKIP_RUN=true" >> "$GITHUB_ENV"
              exit 0
              ;;
          esac

          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
          echo "Resolved TARGET_DATE=$TARGET_DATE"

      - name: Run generator
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ "$SKIP_RUN" = "true" ]; then
            echo "Skipping generator run."
            exit 0
          fi
          if [ -n "$TARGET_DATE" ]; then
            python -m src.shot_props.generate --date "$TARGET_DATE"
          else
            python -m src.shot_props.generate
          fi

      - name: Commit outputs
        run: |
          if [ "${SKIP_RUN:-false}" = "true" ]; then
            echo "Skipping commit step."
            exit 0
          fi
          git config user.name "shot-props-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f output/shot_props/*.txt
          git add -f output/shot_props/instagram/*.json
          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi
          git commit -m "Update shot props outputs"
          git fetch origin main
          git rebase origin/main
          git push
