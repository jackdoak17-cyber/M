name: Generate Polymarket Weekly Posts

on:
  schedule:
    - cron: "0 8 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate weekly posts
        env:
          POLYMARKET_GAMMA_BASE_URL: ${{ vars.POLYMARKET_GAMMA_BASE_URL || 'https://gamma-api.polymarket.com' }}
        run: python -m src.polymarket_posts --generate

      - name: Commit post outputs
        run: |
          git config user.name "polymarket-posts"
          git config user.email "actions@users.noreply.github.com"
          git add picks/polymarket/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Generate Polymarket weekly posts $(date +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push
