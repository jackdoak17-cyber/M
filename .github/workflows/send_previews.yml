name: Send Telegram Previews

on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "30 12 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Preview slot"
        required: true
        default: "weekday_fixture"
        type: choice
        options:
          - weekend_fixture
          - weekend_player_100
          - weekend_player_80
          - weekday_fixture
          - weekday_player

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
          else
            case "${{ github.event.schedule }}" in
              "0 9 * * *") SLOT="weekend_fixture" ;;
              "0 10 * * *") SLOT="weekend_player_100" ;;
              "0 11 * * *") SLOT="weekend_player_80" ;;
              "30 12 * * *") SLOT="weekday_fixture" ;;
              "30 13 * * *") SLOT="weekday_player" ;;
              *) SLOT="" ;;
            esac
          fi
          echo "SLOT=$SLOT" >> "$GITHUB_ENV"

      - name: Send preview
        run: |
          if [ -z "$SLOT" ]; then
            echo "No slot resolved."
            exit 0
          fi
          python -m src.posting.send_previews --slot "$SLOT"
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_ANALYST_X_POST_BOT_TOKEN: ${{ secrets.ODDS_ANALYST_X_POST_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROP_SHEET_TIMEZONE: ${{ vars.PROP_SHEET_TIMEZONE || 'Europe/London' }}
