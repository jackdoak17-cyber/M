name: Send Telegram Previews

on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "30 12 * * *"
    - cron: "30 13 * * *"
    - cron: "0 8 * * 2"
    - cron: "0 16 * * 5"
    - cron: "0 17 * * 5"
    - cron: "30 6 * * 6"
    - cron: "30 6 * * 0"
    - cron: "30 7 * * 6"
    - cron: "30 7 * * 0"
  workflow_dispatch:
    inputs:
      slot:
        description: "Preview slot"
        required: true
        default: "weekday_fixture"
        type: choice
        options:
          - weekend_fixture
          - weekend_player_100
          - weekend_player_80
          - weekday_fixture
          - weekday_player
          - polymarket_weekly
          - shot_props_value
          - shot_props_high_prob
      target_date:
        description: "Override target date (YYYY-MM-DD). Leave blank for tomorrow."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve slot
        run: |
          is_valid_london_cron() {
            CRON_EXPR="$1"
            LONDON_OFFSET="$(TZ='Europe/London' date +%z)"
            case "$CRON_EXPR" in
              "0 16 * * 5"|"30 6 * * 6"|"30 6 * * 0")
                [ "$LONDON_OFFSET" = "+0100" ]
                ;;
              "0 17 * * 5"|"30 7 * * 6"|"30 7 * * 0")
                [ "$LONDON_OFFSET" = "+0000" ]
                ;;
              *)
                return 0
                ;;
            esac
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
          else
            case "${{ github.event.schedule }}" in
              "0 9 * * *") SLOT="weekend_fixture" ;;
              "0 10 * * *") SLOT="weekend_player_100" ;;
              "0 11 * * *") SLOT="weekend_player_80" ;;
              "30 12 * * *") SLOT="weekday_fixture" ;;
              "30 13 * * *") SLOT="weekday_player" ;;
              "0 8 * * 2") SLOT="polymarket_weekly" ;;
              "0 16 * * 5") SLOT="shot_props_value" ;;
              "0 17 * * 5") SLOT="shot_props_value" ;;
              "30 6 * * 6") SLOT="shot_props_high_prob" ;;
              "30 6 * * 0") SLOT="shot_props_high_prob" ;;
              "30 7 * * 6") SLOT="shot_props_high_prob" ;;
              "30 7 * * 0") SLOT="shot_props_high_prob" ;;
              *) SLOT="" ;;
            esac
            if [ -n "$SLOT" ] && ! is_valid_london_cron "${{ github.event.schedule }}"; then
              echo "Skipping ${SLOT} for cron '${{ github.event.schedule }}' (wrong Europe/London offset)."
              SLOT=""
            fi
          fi
          echo "SLOT=$SLOT" >> "$GITHUB_ENV"

      - name: Regenerate fresh prop outputs
        run: |
          rm -f output/by_fixture/*.txt output/player_props/*.txt
          python -m src.main --output-dir output
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PROP_SHEET_TIMEZONE: ${{ vars.PROP_SHEET_TIMEZONE || 'Europe/London' }}

      - name: Send preview
        run: |
          if [ -z "$SLOT" ]; then
            echo "No slot resolved."
            exit 0
          fi
          DATE_ARG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.target_date }}" ]; then
            DATE_ARG="--date ${{ inputs.target_date }}"
          fi
          python -m src.posting.send_previews --slot "$SLOT" $DATE_ARG
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_ANALYST_X_POST_BOT_TOKEN: ${{ secrets.ODDS_ANALYST_X_POST_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROP_SHEET_TIMEZONE: ${{ vars.PROP_SHEET_TIMEZONE || 'Europe/London' }}
